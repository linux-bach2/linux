name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # delete the superseded build cache entry

jobs:
  kernel:
    # Native arm64 runner: no cross toolchain needed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEFCONFIG: bach2_defconfig
      DTB: hisilicon/hi6250-huawei-bach2.dtb
      O: /home/runner/kbuild   # out-of-tree object dir, cached between runs (absolute: actions/cache rejects '..')
      KBUILD_BUILD_USER: ci
      KBUILD_BUILD_HOST: linux-bach2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod python3 device-tree-compiler

      # Incremental builds: the whole object dir is cached, keyed per branch and commit.
      # A new branch falls back to the newest cache of any branch.
      - name: Restore object cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.O }}
          key: kbuild-${{ env.DEFCONFIG }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kbuild-${{ env.DEFCONFIG }}-${{ github.ref_name }}-
            kbuild-${{ env.DEFCONFIG }}-

      # Checkout gives every file the current mtime, which would make make rebuild everything.
      # Pin all sources to an old date, then mark only files changed since the cached commit as new.
      - name: Prepare incremental build
        run: |
          mkdir -p "$O"
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00'
          PREV=$(cat "$O/.ci-sha" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "No object cache: full build" | tee -a $GITHUB_STEP_SUMMARY
          elif [ "$PREV" = "$GITHUB_SHA" ]; then
            echo "Object cache is from this commit" | tee -a $GITHUB_STEP_SUMMARY
          elif git fetch -q --depth=1 origin "$PREV" && git diff --name-only "$PREV" HEAD > /tmp/changed; then
            echo "Object cache from ${PREV:0:12}: $(wc -l < /tmp/changed) changed files" | tee -a $GITHUB_STEP_SUMMARY
            while IFS= read -r f; do [ -e "$f" ] && touch "$f"; done < /tmp/changed
          else
            echo "Cached commit ${PREV:0:12} not fetchable: full build" | tee -a $GITHUB_STEP_SUMMARY
            rm -rf "$O"; mkdir -p "$O"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=$(git log -1 --format=%cD)" >> $GITHUB_ENV

      - name: Configure
        run: |
          [ -f "$O/.config" ] && cp -p "$O/.config" /tmp/old.config
          make O="$O" $DEFCONFIG
          # keep the old mtime if nothing changed, so kconfig does not resync
          if [ -f /tmp/old.config ] && cmp -s /tmp/old.config "$O/.config"; then
            touch -r /tmp/old.config "$O/.config"
          fi

      - name: Build Image, DTBs and modules
        run: |
          set -o pipefail
          make O="$O" -j$(nproc) Image.gz dtbs modules 2>&1 | tee build.log
          echo "### Compiled $(grep -cE '^  (CC|AS) ' build.log) objects" >> $GITHUB_STEP_SUMMARY
          grep -E '(warning|error):' build.log | sort -u > warnings.log || true
          echo "### Build warnings: $(wc -l < warnings.log)" >> $GITHUB_STEP_SUMMARY

      - name: Record cached commit
        if: always()
        run: echo "$GITHUB_SHA" > "$O/.ci-sha"

      # Saved even if the build failed: the objects that did compile are still valid.
      - name: Save object cache
        id: save
        if: always() && steps.cache.outputs.cache-matched-key != format('kbuild-{0}-{1}-{2}', env.DEFCONFIG, github.ref_name, github.sha)
        uses: actions/cache/save@v4
        with:
          path: ${{ env.O }}
          key: kbuild-${{ env.DEFCONFIG }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Drop superseded cache of this branch
        if: always() && steps.save.outcome == 'success' && startsWith(steps.cache.outputs.cache-matched-key, format('kbuild-{0}-{1}-', env.DEFCONFIG, github.ref_name)) && steps.cache.outputs.cache-matched-key != format('kbuild-{0}-{1}-{2}', env.DEFCONFIG, github.ref_name, github.sha)
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.cache.outputs.cache-matched-key }}
        run: gh cache delete "$OLD" -R "$GITHUB_REPOSITORY" || true

      # actions/cache/save only warns when it cannot save; make that visible as a failure.
      - name: Check object cache was saved
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: kbuild-${{ env.DEFCONFIG }}-${{ github.ref_name }}-${{ github.sha }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "$KEY" --json key,sizeInBytes | tee /tmp/c.json
          grep -q "\"$KEY\"" /tmp/c.json || { echo "::error::object cache $KEY was not saved"; exit 1; }
          echo "Object cache saved: $(python3 -c 'import json;print(json.load(open("/tmp/c.json"))[0]["sizeInBytes"]//2**20)') MiB" >> $GITHUB_STEP_SUMMARY

      - name: Package
        run: |
          KREL=$(cat "$O/include/config/kernel.release")
          mkdir -p out/modules
          make -s O="$O" INSTALL_MOD_PATH=$PWD/out/modules INSTALL_MOD_STRIP=1 modules_install
          rm -f out/modules/lib/modules/$KREL/build
          cp "$O/arch/arm64/boot/Image.gz" out/
          cp "$O/arch/arm64/boot/dts/$DTB" out/
          cat "$O/arch/arm64/boot/Image.gz" "$O/arch/arm64/boot/dts/$DTB" > out/Image.gz-dtb
          cp "$O/.config" out/config
          cp "$O/System.map" warnings.log out/
          tar -C out/modules -czf out/modules-$KREL.tar.gz lib
          rm -rf out/modules
          (cd out && sha256sum * > SHA256SUMS)
          echo "kernel.release: $KREL" >> $GITHUB_STEP_SUMMARY
          ls -l out >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: bach2-kernel-${{ github.sha }}
          path: out/
          if-no-files-found: error
