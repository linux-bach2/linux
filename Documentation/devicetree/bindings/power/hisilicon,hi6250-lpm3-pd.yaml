%YAML 1.2
---
$id: http://devicetree.org/schemas/power/hisilicon,hi6250-lpm3-pd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi6250 power domains switched by the LPM3 firmware

maintainers:
  - linux-bach2 <linux-bach2@users.noreply.github.com>

description:
  On the Hi6250 (Kirin 659) some power domains, such as the Mali GPU (G3D), are
  switched by the LPM3 power management firmware on request over an IPC
  mailbox. The power state is read back from the CRG.

properties:
  compatible:
    const: hisilicon,hi6250-lpm3-pd

  "#power-domain-cells":
    const: 1

  mboxes:
    maxItems: 1
    description: The IPC mailbox to LPM3 that takes the power requests.

  hisilicon,crg-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The CRG (peripheral clock and reset generator) syscon.

required:
  - compatible
  - "#power-domain-cells"
  - mboxes
  - hisilicon,crg-syscon

additionalProperties: false

examples:
  - |
    power-controller {
        compatible = "hisilicon,hi6250-lpm3-pd";
        hisilicon,crg-syscon = <&crg_ctrl>;
        mboxes = <&mailbox 14 3 1>;
        #power-domain-cells = <1>;
    };
